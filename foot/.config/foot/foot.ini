include=~/.config/foot/themes/colorscheme.ini
include=~/.config/foot/themes/theme.ini

[main]
term = xterm-256color
font = monospace:size=12
line-height = 17 # font*1.4
pad = 7x4 center

[tweak]
box-drawing-base-thickness = 0.02

[scrollback]
indicator-position = none

[mouse-bindings]
primary-paste = none

[key-bindings]
primary-paste = none
clipboard-copy = Control+Insert
clipboard-paste = Shift+Insert
color-theme-toggle = Control+Shift+t
