<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- sans-serif fonts -->
  <match target="pattern">
    <test name="family" compare="eq">
      <if>
        <or>
          <eq>
            <name>family</name>
            <string>sans-serif</string>
          </eq>
          <eq>
            <name>family</name>
            <string>-apple-system</string>
          </eq>
          <eq>
            <name>family</name>
            <string>BlinkMacSystemFont</string>
          </eq>
          <eq>
            <name>family</name>
            <string>Segoe UI</string>
          </eq>
          <eq>
            <name>family</name>
            <string>Roboto</string>
          </eq>
          <eq>
            <name>family</name>
            <string>Arial</string>
          </eq>
        </or>
        <name>family</name>
        <string/>
      </if>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Geist</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- serif fonts -->
  <match target="pattern">
    <test name="family" compare="eq">
      <if>
        <or>
          <eq>
            <name>family</name>
            <string>serif</string>
          </eq>
          <eq>
            <name>family</name>
            <string>Georgia</string>
          </eq>
        </or>
        <name>family</name>
        <string/>
      </if>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Merriweather</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- monospace fonts -->
  <match target="pattern">
    <test name="family" compare="eq">
      <if>
        <or>
          <eq>
            <name>family</name>
            <string>monospace</string>
          </eq>
          <eq>
            <name>family</name>
            <string>ui-monospace</string>
          </eq>
          <eq>
            <name>family</name>
            <string>Liberation Mono</string>
          </eq>
        </or>
        <name>family</name>
        <string/>
      </if>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>CaskaydiaMono Nerd Font</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- use the emoji font first for emoji requests -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>und-zsye</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- rendering settings for text fonts -->
  <match target="font">
    <test name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
