# WebGPU uses Vulkan on Linux, but Helium leaves the Vulkan feature off by default.
# Without it, navigator.gpu.requestAdapter() returns null (WebGPU games fail to start).
# The ANGLE Vulkan features also stop the white-video bug that plain Vulkan causes on AMD.
--enable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE
